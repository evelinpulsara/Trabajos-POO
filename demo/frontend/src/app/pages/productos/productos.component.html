<div class="page-container">
  <div class="page-header">
    <h1>Productos</h1>
    <button class="btn-primary" (click)="openModal()">+ Nuevo Producto</button>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of productos">
          <td>{{ producto.id }}</td>
          <td>{{ producto.nombre }}</td>
          <td>${{ producto.precio }}</td>
          <td>{{ producto.stock }}</td>
          <td>
            <button class="btn-edit" (click)="openModal(producto)">Editar</button>
            <button class="btn-delete" (click)="deleteProducto(producto.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal" *ngIf="showModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>{{ editingProducto ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
        <button class="btn-close" (click)="closeModal()">×</button>
      </div>
      <form [formGroup]="productoForm" (ngSubmit)="saveProducto()">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" formControlName="nombre">
        </div>
        <div class="form-group">
          <label>Precio</label>
          <input type="number" step="0.01" formControlName="precio">
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" formControlName="stock">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="!productoForm.valid">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
