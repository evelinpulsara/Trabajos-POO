<div class="page-container">
  <div class="page-header">
    <h1>Clientes</h1>
    <button class="btn-primary" (click)="openModal()">+ Nuevo Cliente</button>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Creado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientes">
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.email }}</td>
          <td>{{ cliente.telefono }}</td>
          <td>{{ cliente.creado_en | date }}</td>
          <td>
            <button class="btn-edit" (click)="openModal(cliente)">Editar</button>
            <button class="btn-delete" (click)="deleteCliente(cliente.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal" *ngIf="showModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>{{ editingCliente ? 'Editar Cliente' : 'Nuevo Cliente' }}</h2>
        <button class="btn-close" (click)="closeModal()">×</button>
      </div>
      <form [formGroup]="clienteForm" (ngSubmit)="saveCliente()">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" formControlName="nombre">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" formControlName="telefono">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="!clienteForm.valid">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
